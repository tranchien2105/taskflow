services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev

    container_name: taskflow-backend

    env_file:
      - ./backend/.env

    volumes:
      - ./backend:/app
      - /app/node_modules

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      elasticsearch:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine

    container_name: taskflow-postgres

    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U taskflow -d taskflow",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

    container_name: taskflow-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest

    container_name: taskflow-mailpit

    ports:
      - "8025:8025"
      - "1025:1025"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0

    container_name: taskflow-elasticsearch

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data: